[project]
name = "barcode-tui"
version = "0.1.0"
description = "Terminal UI for looking up products by barcode"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual",
    "httpx",
    "python-dotenv",
    "diskcache",
]

[project.scripts]
barcode-tui = "barcode_tui.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "textual-dev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barcode_tui"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
